# Bosun's policy for one-shot Gemini CLI calls (summaries, "Will this break?"). It is copied into the call's own
# empty folder and passed with --policy; it is never written into the user's ~/.gemini settings.
# A global deny (no argument filter) removes the tool from the model, and --policy loads at user tier, which
# outranks plan mode's default allows. The policy engine docs shipped with 0.71.1 (docs/reference/policy-engine.md)
# define `toolName = "*"` as any tool, built-in or MCP, and `mcpName = "*"` as every tool of any MCP server; both
# are denied, and every built-in tool is also named (names from the 0.71.1 bundle; an unknown name is harmless) in
# case a wildcard ever stops matching. Policy engine: https://geminicli.com/docs/reference/policy-engine.md

[[rule]]
toolName = "*"
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: no tools."

[[rule]]
toolName = "*"
mcpName = "*"
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: no MCP tools."

[[rule]]
toolName = ["run_shell_command"]
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: no commands."

[[rule]]
toolName = ["read_file", "read_many_files", "write_file", "replace", "list_directory", "glob", "grep_search",
            "take_snapshot"]
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: no files."

[[rule]]
toolName = ["web_fetch", "google_web_search"]
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: no web."

[[rule]]
toolName = ["save_memory", "write_todos", "update_topic", "tracker_create_task", "tracker_update_task",
            "tracker_get_task", "tracker_list_tasks", "tracker_add_dependency", "tracker_visualize"]
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: nothing is kept."

[[rule]]
toolName = ["list_mcp_resources", "read_mcp_resource", "invoke_agent", "codebase_investigator", "activate_skill",
            "get_internal_docs", "ask_user", "enter_plan_mode", "exit_plan_mode", "complete_task"]
decision = "deny"
priority = 900
deny_message = "Bosun's one-shot calls reply with text only: no MCP, agents, skills or questions."
